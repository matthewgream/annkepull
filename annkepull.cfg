
# annkepull -- archive event clips from Annke (Hikvision-firmware) camera SD cards.
# Installed as /etc/default/annkepull; a per-host annkepull.<hostname>.cfg is used instead when present.

# camera-<name>=<host>: each camera's clips go to <archive>/<name>/<YYYYMMDD>/; <archive>/<name> must already exist
#camera-front=webcam-front.local
archive=/opt/storage/camera

username=admin
password=CHANGEME

# seconds after a clip ends before it is fetched (the camera may still be writing it)
settle=600
